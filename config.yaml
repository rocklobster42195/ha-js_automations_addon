name: "JS Automations"
version: "3.1.0"
slug: "js_automations"
description: "JavaScript Automations-Engine"
image: "ghcr.io/rocklobster42195/ha-js_automations_addon/{arch}"
arch:
  - aarch64
  - amd64
startup: "services"
boot: "auto"
ingress: true
ingress_port: 3000
ports:
  3001/tcp: 3001
  3002/tcp: 3002
ports_description:
  3001/tcp: "Webhook receiver (ha.onWebhook)"
  3002/tcp: "MCP server for AI clients"
panel_icon: "mdi:robot-happy-outline"
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - config:rw
options: {}
schema:
  store_encryption: bool?